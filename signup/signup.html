<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vape Shop - Sign up</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="signup.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="../img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <nav class="navbar navbar-expand-lg navbar-light">
    <a class="brand" href="../home-page/index.html" aria-label="Vape Shop home">
      <img class="icon" src="../img/logo.png" alt="">
      <span>Vape<span class="brand-accent">Shop</span></span>
    </a>
      <button id="navbarToggler" class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item active hover-underline-animation">
            <a class="nav-link" href="../home-page/index.html">Home</a>
          </li>
          <li class="nav-item hover-underline-animation">
            <a class="nav-link" href="#myModal" data-toggle="modal">About</a>
          </li>
          <li class="nav-item hover-underline-animation">
            <a class="nav-link" href="../home-page/index.html#liquids">Shop</a>
          </li>
          <li class="nav-item hover-underline-animation">
            <a class="nav-link" href="../home-page/index.html#contact-bottom">Contact</a>
          </li>
          <li class="nav-item hover-underline-animation">
            <a class="nav-link" href="../login/login.html" id="login-here">Sign in</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>

  <!--Video-->
  <video id="video-bg" autoplay muted loop>
    <source src="../video/smoke2.mp4" type="video/mp4">
  </video>

  <!-- Modal HTML -->
  <div id="myModal" class="modal fade">
    <div class="modal-dialog modal-confirm">
      <div class="modal-content">
        <div class="modal-header">
          <div class="icon-box">
            <svg class="alert-icon" viewBox="0 0 64 64" role="img" aria-label="Information">
              <circle cx="32" cy="32" r="29" fill="currentColor"></circle>
              <path d="M32 18v17" stroke="#171714" stroke-width="4" stroke-linecap="round"></path>
              <circle cx="32" cy="45" r="2.5" fill="#171714"></circle>
            </svg>
          </div>
        </div>
        <div class="modal-body text-center">
          <h4>Something went wrong</h4>	
          <p>This function is under maintenance.</p>
          <button class="btn btn-primary" data-dismiss="modal">ok</button>
        </div>
      </div>
    </div>
  </div>




  <!--LOGIN CONTAINER-->
  <div class="login-container animate-element">
    
    <div class="login-form">
      <span class="auth-kicker">JOIN VAPE SHOP</span>
      <h2>Sign Up</h2>
      <p class="auth-description">Create an account to get started.</p>
      <div class="input-container user-container">
        <i class="fas fa-envelope input-icon" aria-hidden="true"></i>
        <input id="username-input" type="text" placeholder="Email or phone number" aria-label="Email or phone number" autocomplete="username">
        
      </div>
      
      <div class="input-container pass-container">
        <i class="fas fa-lock input-icon" aria-hidden="true"></i>
        <input id="password-input" type="password" placeholder="Password" aria-label="Password" autocomplete="new-password">
        
      </div>
      
      <div class="input-container pass-container">
        <i class="fas fa-lock input-icon" aria-hidden="true"></i>
        <input id="repeat-password-input" type="password" placeholder="Repeat Password" aria-label="Repeat password" autocomplete="new-password">
        
      </div>
      
      <div class="input-container">
        <i class="fas fa-calendar-alt input-icon" aria-hidden="true"></i>
        <input id="birthday-input" type="date" required aria-label="Birthday">
      </div>
      
      <a href="#myModal" data-toggle="modal"><button id="login-button" class="btn">Sign Up</button></a>
      <div class="social-buttons">
        <a href="#myModal" data-toggle="modal"><button class="facebook-button">
          <i class="fab fa-facebook-square facebook-icon"></i>
          Sign up with Facebook
        </button></a>
        <a href="#myModal" data-toggle="modal"><button class="gmail-button">
          <i class="fab fa-google gmail-icon"></i>
          Sign up with Gmail
        </button></a>
      </div>
      <p class="auth-switch">Already have an account? <a href="../login/login.html">Sign in</a></p>

      
    </div>
  </div>


  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="signup.js"></script>
</body>
</html>
