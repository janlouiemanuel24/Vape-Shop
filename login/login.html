<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vape Shop - Login</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="../img/logo.png">
  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <header class="header">
      <nav class="navbar navbar-expand-lg navbar-light">
      <a class="brand" href="../home-page/index.html" aria-label="Vape Shop home">
        <img class="icon" src="../img/logo.png" alt="">
        <span>Vape<span class="brand-accent">Shop</span></span>
      </a>
        <button id="navbarToggler" class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item active">
              <a class="nav-link hover-underline-animation" href="../home-page/index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link hover-underline-animation" href="#myModal" data-toggle="modal">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link hover-underline-animation" href="../home-page/index.html#liquids">Shop</a>
            </li>
            <li class="nav-item">
              <a class="nav-link hover-underline-animation" href="../home-page/index.html#contact-bottom">Contact</a>
            </li>
            <li class="nav-item">
              <a id="login-here" class="nav-link hover-underline-animation" href="../signup/signup.html">Create account</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>



      <!--VIDEO SOURCE-->
      <video id="video-bg" autoplay muted loop>
        <source src="../video/smoke2.mp4" type="video/mp4">
      </video>
 


  <!-- Add a login container -->
  <div class="login-container animate-element">
    <div class="login-form">
      <span class="auth-kicker">WELCOME BACK</span>
      <h2>Login</h2>
      <p class="auth-description">Sign in to continue to your account.</p>
      <div class="input-container user-container">
        <i class="fas fa-user" aria-hidden="true"></i>
        <input id="username-input" type="text" placeholder="Username" aria-label="Username" autocomplete="username">
      </div>  
      <div class="input-container pass-container">
        <i class="fas fa-lock" aria-hidden="true"></i>
        <input id="password-input" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password">
      </div>
      <a href="#myModal" data-toggle="modal" id="login-button" class="btn">Login</a>
      <p class="auth-switch">New to Vape Shop? <a href="../signup/signup.html">Create an account</a></p>
    </div>
  </div>

  
  <!-- Modal HTML -->
  <div id="myModal" class="modal fade">
    <div class="modal-dialog modal-confirm">
      <div class="modal-content">
        <div class="modal-header">
          <div class="icon-box">
            <svg class="alert-icon" viewBox="0 0 64 64" role="img" aria-label="Information">
              <circle cx="32" cy="32" r="29" fill="currentColor"></circle>
              <path d="M32 18v17" stroke="#171714" stroke-width="4" stroke-linecap="round"></path>
              <circle cx="32" cy="45" r="2.5" fill="#171714"></circle>
            </svg>
          </div>
        </div>
        <div class="modal-body text-center">
          <h4>Something went wrong</h4>	
          <p>This function is under maintenance.</p>
          <button class="btn btn-primary" data-dismiss="modal">ok</button>
        </div>
      </div>
    </div>
  </div>
  
  
  
  
  
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="login.js"></script>
</body>
</html>
